<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh Thông Minh Bằng Mã QR</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        @media print { .no-print { display: none !important; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-emerald-100/60 to-teal-50 min-h-screen text-slate-800 antialiased">
    <div class="max-w-5xl mx-auto p-4 sm:p-6 md:p-8">
        <header class="text-center mb-8 no-print">
            <div class="inline-flex items-center justify-center p-3 bg-emerald-600 text-white rounded-2xl shadow-lg mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">HỆ THỐNG ĐIỂM DANH THÔNG MINH BẰNG MÃ QR</h1>
        </header>

        <div class="flex justify-center mb-6 no-print overflow-x-auto pb-2 custom-scrollbar">
            <div class="bg-white/80 backdrop-blur-sm p-1.5 rounded-2xl flex space-x-1 shadow-inner border border-emerald-100 min-w-max">
                <button onclick="switchTab('scan')" id="btn-scan" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition-all bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-200">📸 Quét Mã</button>
                <button onclick="switchTab('list')" id="btn-list" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-slate-600 hover:text-emerald-700">📋 Danh Sách</button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-slate-600 hover:text-emerald-700">📊 Thống Kê</button>
                <button onclick="switchTab('ranking')" id="btn-ranking" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-slate-600 hover:text-amber-600">🏆 Thi Đua</button>
                <button onclick="switchTab('search')" id="btn-search" class="px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-slate-600 hover:text-blue-600">🔍 Tra Cứu</button>
            </div>
        </div>

        <div id="tab-scan" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-emerald-50 transition-all">
            <div class="text-center max-w-md mx-auto">
                <div id="start-btn-container" class="py-6">
                    <button onclick="startScanner()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition-all mx-auto">📸 Bắt đầu quét mã QR</button>
                </div>
                <div id="scanner-wrapper" class="hidden">
                    <button onclick="stopScanner()" class="text-xs font-medium text-rose-600 bg-rose-50 rounded-lg px-3 py-1.5 mb-4">⏹️ Tắt Camera</button>
                    <div id="reader" class="w-full overflow-hidden rounded-2xl border-4 border-emerald-100 bg-slate-900 shadow-inner relative"></div>
                </div>
                <div id="result-box" class="mt-6 hidden p-4 rounded-2xl text-center text-sm font-semibold transition-all"></div>
            </div>
        </div>

        <div id="tab-list" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-emerald-50 hidden">
            <div class="flex justify-between gap-4 mb-6 no-print">
                <h2 class="text-lg font-bold text-slate-800">Danh Sách Học Sinh</h2>
                <div class="flex space-x-2"><button onclick="window.print()" class="px-4 py-2 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-semibold">🖨️ In thẻ</button></div>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-300 bg-white p-1">
                <table class="w-full text-left border-collapse border border-slate-300">
                    <thead><tr class="bg-slate-100 text-slate-600 text-xs font-bold uppercase"><th class="py-3 px-4 border">Mã</th><th class="py-3 px-4 border">Họ và Tên</th><th class="py-3 px-4 border">Lớp</th><th class="py-3 px-4 border text-center">QR</th></tr></thead>
                    <tbody id="student-table-body" class="text-sm text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-dashboard" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-emerald-50 hidden">
            <div class="text-center text-slate-500 py-10 font-semibold">Khu vực thống kê và biểu đồ đang hiển thị...</div>
        </div>
        <div id="tab-ranking" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-emerald-50 hidden">
            <div class="text-center text-slate-500 py-10 font-semibold">Bảng xếp hạng thi đua đang hiển thị...</div>
        </div>

        <!-- TAB 5: TRA CỨU & AI -->
        <div id="tab-search" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border border-emerald-50 hidden">
            <div class="max-w-2xl mx-auto">
                <div class="text-center mb-6"><h2 class="text-xl font-bold text-slate-800 mb-2">Tra Cứu Chuyên Cần Cá Nhân</h2></div>
                <div class="flex gap-2 mb-8">
                    <input type="text" id="search-input" placeholder="Nhập Mã Học Sinh (Ví dụ: HS001)..." class="flex-1 px-4 py-3 rounded-xl border-2 border-emerald-100 focus:outline-none uppercase text-sm font-semibold">
                    <button onclick="searchStudent()" class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md">🔍 Tra cứu</button>
                </div>
                <div id="search-result-box" class="transition-all"></div>
            </div>
        </div>

        <div class="text-center mt-10 pt-4 border-t border-emerald-200/60 text-slate-600 text-sm font-medium no-print">
            Dự án thiết kế bởi <strong>GV: Trương Thị Kim Tâm</strong>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdgibjOgryGEZ9jorZf7cRNdeq3neleZGeRypPzGCYg1rcJcFZx1D8nsUAm2M_0uscTA/exec";
        let html5QrCode = null; const scannedCodes = {}; const COOLDOWN_TIME = 2 * 60 * 1000; 
        let studentDataCache = {};

        window.onload = function() {
            fetch(WEB_APP_URL).then(res => res.json()).then(data => {
                data.forEach(student => { studentDataCache[student.maHS || student[0]] = { hoTen: student.hoTen || student[1], lop: student.lop || student[2] || "Khác" }; });
            });
        };

        function switchTab(tab) {
            const tabs = ['scan', 'list', 'dashboard', 'ranking', 'search'];
            tabs.forEach(t => { document.getElementById(`tab-${t}`).classList.add('hidden'); let btn = document.getElementById(`btn-${t}`); if(btn) btn.className = "px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-600 hover:text-emerald-700"; });
            document.getElementById(`tab-${tab}`).classList.remove('hidden'); let activeBtn = document.getElementById(`btn-${tab}`); if(activeBtn) activeBtn.className = "px-4 py-2.5 rounded-xl font-semibold text-sm bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-200";
            if (tab === 'scan') startScanner(); else stopScanner();
            if (tab === 'list') loadStudentData();
        }

        function startScanner() {
            document.getElementById('start-btn-container').classList.add('hidden'); document.getElementById('scanner-wrapper').classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess);
        }

        function stopScanner() { if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().then(() => { document.getElementById('start-btn-container').classList.remove('hidden'); document.getElementById('scanner-wrapper').classList.add('hidden'); }); }

        function onScanSuccess(decodedText) {
            html5QrCode.pause(); let now = new Date();
            if (scannedCodes[decodedText]) { if ((now.getTime() - scannedCodes[decodedText]) < COOLDOWN_TIME) { showResult(`⚠️ Đã điểm danh.`, "error"); setTimeout(() => { if (html5QrCode) html5QrCode.resume(); }, 2000); return; } }
            scannedCodes[decodedText] = now.getTime();
            let h = now.getHours(), m = now.getMinutes(), timeInMinutes = h * 60 + m, trangThai = "Vắng"; 
            if (h < 12) { trangThai = (timeInMinutes >= 375 && timeInMinutes <= 420) ? "Có mặt" : ((timeInMinutes > 420 && timeInMinutes <= 675) ? "Muộn" : "Vắng"); } 
            else { trangThai = (timeInMinutes >= 735 && timeInMinutes <= 780) ? "Có mặt" : ((timeInMinutes > 780 && timeInMinutes <= 1035) ? "Muộn" : "Vắng"); }

            let info = studentDataCache[decodedText] || studentDataCache[decodedText.toUpperCase()];
            let thongTinHienThi = info ? `<b>${info.hoTen}</b> (Lớp ${info.lop})` : `Mã HS: ${decodedText}`;
            showResult(`⏳ Đang xử lý...`, "info");

            fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ maHS: decodedText, thoiGian: now.toISOString(), trangThai: trangThai }) })
            .then(() => showResult(`🎉 Thành công! ${thongTinHienThi} - ${trangThai}`, "success")).finally(() => setTimeout(() => { if (html5QrCode) html5QrCode.resume(); }, 2500));
        }

        function showResult(message, type) {
            const box = document.getElementById('result-box'); box.classList.remove('hidden');
            let color = type === 'success' ? 'emerald' : (type === 'error' ? 'rose' : (type === 'warning' ? 'amber' : 'teal'));
            box.className = `mt-6 p-4 rounded-2xl text-center text-sm font-semibold bg-${color}-50 text-${color}-700 border border-${color}-200 shadow-sm`; box.innerHTML = message; 
        }

        function loadStudentData() {
            fetch(WEB_APP_URL).then(res => res.json()).then(data => {
                let html = ''; data.forEach((s, i) => { if(i===0) return; html += `<tr><td class="py-2 border text-center">${s[0]}</td><td class="py-2 border px-2">${s[1]}</td><td class="py-2 border text-center">${s[2]||"Khác"}</td><td class="py-2 border text-center"><div id="qr-${i}" class="inline-block p-1 bg-white"></div></td></tr>`; });
                document.getElementById('student-table-body').innerHTML = html; data.forEach((s, i) => { if(i>0) new QRCode(document.getElementById(`qr-${i}`), { text: s[0], width: 50, height: 50 }); });
            });
        }

        function searchStudent() {
            let maSearch = document.getElementById('search-input').value.trim().toUpperCase();
            let info = studentDataCache[maSearch] || studentDataCache[maSearch.toLowerCase()];
            if(!info) { document.getElementById('search-result-box').innerHTML = '<div class="text-center text-rose-600 bg-rose-50 p-4 rounded-xl border">❌ Không tìm thấy thông tin học sinh!</div>'; return; }
            document.getElementById('search-result-box').innerHTML = '<div class="text-center py-8">⏳ Đang tải...</div>';

            fetch(WEB_APP_URL + "?action=getStats").then(res => res.json()).then(data => {
                let coMat = 0, muon = 0;
                data.forEach(row => { let rMa = (row[0] || "").toString().toUpperCase(); if(rMa === maSearch) { if(row[2] === "Có mặt") coMat++; else if(row[2] === "Muộn") muon++; } });
                
                let profileHtml = `
                    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border p-5 rounded-2xl shadow-sm">
                        <h3 class="font-extrabold text-blue-900 text-xl">${info.hoTen}</h3><p class="text-sm text-blue-700 font-medium">Lớp: ${info.lop}</p>
                        <div class="grid grid-cols-2 gap-3 mt-4 text-center">
                            <div class="bg-white p-3 rounded-xl border border-emerald-100"><div class="font-black text-2xl text-emerald-600">${coMat}</div><div class="text-[11px] font-bold text-slate-500 mt-1">ĐÚNG GIỜ</div></div>
                            <div class="bg-white p-3 rounded-xl border border-amber-100"><div class="font-black text-2xl text-amber-500">${muon}</div><div class="text-[11px] font-bold text-slate-500 mt-1">ĐI MUỘN</div></div>
                        </div>
                        <button onclick="goiAI('${info.hoTen}', ${coMat}, ${muon})" class="mt-4 w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md">🤖 Phân Tích Bằng AI</button>
                        <div id="ai-result" class="mt-4 text-sm text-indigo-900 bg-white p-4 rounded-xl hidden border-l-4 border-indigo-500 shadow-inner"></div>
                    </div>`;
                document.getElementById('search-result-box').innerHTML = profileHtml;
            });
        }

        function goiAI(ten, comat, muon) {
            let box = document.getElementById('ai-result'); box.classList.remove('hidden'); box.innerHTML = '<span class="animate-pulse">✨ AI đang suy nghĩ lời nhận xét...</span>';
            fetch(WEB_APP_URL + `?action=getAI&ten=${encodeURIComponent(ten)}&comat=${comat}&muon=${muon}`)
                .then(res => res.text()).then(text => { box.innerHTML = `<strong>AI Nhận xét:</strong><br>${text.replace(/\n/g, '<br>')}`; })
                .catch(err => box.innerHTML = '❌ Lỗi kết nối máy chủ AI.');
        }

        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    </script>
</body>
</html>
